name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check
      - name: Generate exact candidate evidence
        shell: bash
        run: |
          mkdir -p release-evidence
          npm pack --json > release-evidence/pack.json
          node scripts/release-integrity.ts pack-output release-evidence/pack.json package.json
          node scripts/release-integrity.ts candidate-provenance release-evidence/pack.json package.json > release-evidence/provenance.intoto.json
          npm sbom --sbom-format cyclonedx > release-evidence/sbom.cdx.json
          npm audit --json > release-evidence/audit.json
          npm audit signatures > release-evidence/signatures.txt
          node scripts/release-integrity.ts licenses package-lock.json docs/license-dispositions.json > release-evidence/licenses.json
          node scripts/opencode-host-matrix.ts --pack-json release-evidence/pack.json --output release-evidence/opencode-host-matrix.json
          sha256sum release-evidence/* opencode-artifacts-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: exact-candidate-evidence
          path: |
            release-evidence/
            opencode-artifacts-*.tgz
          retention-days: 14

  portable-platforms:
    name: portable-platform-${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: exact-candidate-evidence
          path: candidate-input
      - name: Clean packed install and portable-output smoke
        run: node scripts/candidate-platform-smoke.ts --output platform-evidence/${{ runner.os }}.json --candidate-dir candidate-input
      - uses: actions/upload-artifact@v4
        with:
          name: portable-platform-${{ runner.os }}-${{ runner.arch }}
          path: platform-evidence/*.json
          if-no-files-found: error
          retention-days: 14
